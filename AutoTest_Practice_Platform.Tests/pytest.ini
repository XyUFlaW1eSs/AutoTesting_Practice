[pytest]
# 配置默认执行参数：包含 Allure 报告数据收集、详细输出
addopts = -vs --alluredir=./AutoTest_Practice_Platform.Tests/reports/allure-results --clean-alluredir

# 指定测试搜寻路径
testpaths = api_tests ui_tests e2e_tests

# 注册自定义测试标签，便于按需过滤运行
markers =
    smoke: 冒烟测试，覆盖核心主流程 (如登录、核心CRUD)
    api: 纯后端接口测试
    ui: 纯前端UI渲染与交互测试 (通常伴随 Mock 拦截)
    e2e: 端到端全链路业务流转测试 (真实网络、真实数据落库)
    performance: 性能与稳定性测试

# 忽略不必要的警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning